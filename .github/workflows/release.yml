name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Require a reviewed main commit
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Prepare versioned changelog
        id: notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-notes.mjs --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/proxmiu-release-notes.md"
      - name: Publish release changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.notes.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          notes_path="$RUNNER_TEMP/proxmiu-release-notes.md"
          git -c credential.helper='!gh auth git-credential' fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          if gh release view "$RELEASE_TAG" --json id >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file "$notes_path"
          else
            release_flags=()
            if [[ "$PRERELEASE" == 'true' ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" --verify-tag --title "Proxmiu $RELEASE_TAG" --notes-file "$notes_path" "${release_flags[@]}"
          fi
