<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Proxmiu</title>
    <meta name="description" content="Manage Proxmox VE on your local network: power actions, SSH in the browser, and one-click Claude Code, Codex and OpenCode servers." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=lynx-1" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=lynx-1" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Proxmiu" />
    <meta name="theme-color" content="#0c0907" />
    <script>
      try {
        const t = localStorage.getItem('proxmiu-theme')
        const dark = t ? t === 'dark' : true
        document.documentElement.classList.toggle('dark', dark)
      } catch {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script defer src="%BASE_URL%lynx-easter-egg.js"></script>
  </body>
</html>
